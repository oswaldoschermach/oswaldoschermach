name: Daily activity log

on:
  schedule:
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append daily note
        run: |
          mkdir -p notes
          echo "- $(date -u +%Y-%m-%d): Atualização diária automática do activity log" >> notes/activity-log.md

      - name: Commit and push
        run: |
          git config user.name "Oswaldo Schermach"
          git config user.email "oswaldo.schermach@gmail.com"
          git add notes/activity-log.md
          git diff --staged --quiet || git commit -m "chore: atualização diária do activity log"
          git push
